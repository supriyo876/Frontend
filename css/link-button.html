<!DOCTYPE html>
<html>
    <head>
        <title>links</title>
        <style>
            body{
                text-align: center;
                background-color: gray;
            }
          a:link, a:visited{
            border: 2px solid green;
            background-color: white;
            color: rgb(40, 121, 201);
            padding: 10px 20px;
            text-decoration: none;
            display: inline-block;
            border-radius: 20px;
          }  
          a:hover , a:active{
            background-color: green;
            color: aliceblue;
          }
        </style>
    </head>
    <body>
    <p><b><a href="https://www.w3schools.com/css/css_link.asp">open this link</a></b></p>
    </body>
</html>
