<!DOCTYPE html>
<html>
    <head>
        <title>
            round border
        </title>
        <style>
          p.normal{
            border: 2px solid green;
            padding: 5px;
            text-align: center;
          }  
          p.round1{
            border: 2px solid green;
            border-radius: 5px;
            padding: 5px;
            text-align: center;
          }
          p.round2{
            border: 2px solid green;
            border-radius: 10px;
            padding: 5px;
            text-align: center;
          }
        </style>
    </head>
    <body>
        <p class="normal">horwo</p>
        <p class="round1">fklff</p>
        <p class="round2">elkjfpo</p>
    </body>
</html>
