<!DOCTYPE html>
<html>
     <head>
        <title>border sides</title>
        <style>
            body{
                text-align: center;
            }
            p.four{
                border-style: solid dotted dashed double;
            }
            p.three{
                border-style: dotted solid dashed;
            }
            p.two{
                border-style: solid dashed;/*top bottom solid and left right dashed*/
            }
        </style>
     </head>
     <body>
        <p class="four">this  is something</p>
        <p class="three">rewtwertrrwewewew</p>
        <p class="two"> dhishum dhishum</p>
        <h1>jonab kemon achen?</h1>
     </body>
</html>
