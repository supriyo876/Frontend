<!DOCTYPE html>
<html>
    <head>
        <title>position absulate</title>
        <style>
            div.relative{
                position: relative;
                width: 100%;
                height: 270px;
                border: 3px solid orangered;
                background-color: gray;
                color: whitesmoke;
            }
            div.absulate{
                position:absolute;
                width: 50%;
                border: 3px solid darkblue;
                background-color: azure;
                color: black;
                text-align: center;
                top: 50%;
                margin-left: 25%; 
                border-radius: 10px;  
                padding: 6px;                     
            }
            img{
                width: 100%;
                height: auto;
                font-size: 18px;
            }
        </style>
    </head>
    <body>
        <h2>position</h2>
        <div class="relative">
            <div class="absulate">enter here meow</div>
        </div>
    </body>
</html>
