<!DOCTYPE html>
<html>
    <head>
        <title>box-sizing properties</title>
        <style>
            div.exx1{
                width: 300px;
                background-color: blueviolet;
            }
            div.ex2{
                width: 300px;
                background-color: aqua;
                padding: 35px;
                box-sizing: border-box;
            }
        </style>
    </head>
    <body>
        <h2>padding and elemenet with box-sizing</h2>
        <div class="exx1 ">hola amigos</div>
        <div class="ex2">this is somthing i wanr to share with you</div>
    </body>
</html>
