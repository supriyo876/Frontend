<!DOCTYPE html>
<html>
    <head>
        <style>
            p.dotted{
                border-style: dotted ;
                background-color: antiquewhite;
                color:red;
                padding: 10px;
                text-align: center;
                border-color: blue;
            }
            p.dashed{
                border-style: dashed;
                background-color: aliceblue;
                color:brown;
                padding: 10px;
                text-align: center;
                border-color: aqua;
            }
            p.solid{
                border-style: solid;
                background-color: aqua;
                padding: 10px;
                text-align: center;
                border-color: brown;
            }
            p.double{
                border-style: double;
                background-color: bisque;
                padding: 10px;
                text-align: center;
                border-color: blueviolet;
            }
            p.none{
                border-style: none;
                background-color: brown;
                padding: 10px;
                text-align: center;
                border-color: gold;
            }
            p.hidden{
                border-style: hidden;
                background-color: blue;
                text-align: center;
                border-color: blue;
            }
            p.outset{
                border-style: outset;
                background-color: blanchedalmond;
                padding: 10px;
                text-align: center;
                border-color: blueviolet;
            }
        </style>
        <body>
            <p class="dotted"> a dotted border</p>
            <p class="dashed"> a dashed border</p>
            <p class="solid ;"> a solid border</p>
            <p class="double">its a double border</p>
            <p class="none"> with border none </p>
            <p style="hidden">with hidden border</p>
            <p class="outset"> outset borrder</p>


        </body>
    </head>
</html>
