<!DOCTYPE html>
<html>
    <head>
        <title>this is links</title>
        <style>
            a:link{
            background-color: bisque;
            }
            a:visited{
                background-color: aquamarine;
            }
            a:hover{
                background-color: black;
            }
            a:active{
                background-color: bisque;
            }
            a{
                text-decoration: none;
                
            }
        </style>
    </head>
    <body>
        <p><b><a href="https://www.w3schools.com/css/css_link.asp"> this is a link</a></b></p>
    </body>
</html>
